name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.204
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore MoniTopo.slnx --locked-mode
      - name: Restore self-contained runtime packs
        run: dotnet restore src/MoniTopo.App/MoniTopo.App.csproj --runtime win-x64 --locked-mode --no-dependencies -p:SelfContained=true
      - name: Restore packaging tool
        run: dotnet tool restore
      - name: Verify formatting
        run: dotnet format MoniTopo.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build MoniTopo.slnx --configuration Release --no-restore
      - name: Test Core with coverage
        run: dotnet test tests/MoniTopo.Core.Tests/MoniTopo.Core.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/core
      - name: Enforce Core coverage
        shell: pwsh
        run: ./eng/Test-CoreCoverage.ps1 -CoverageDirectory artifacts/coverage/core
      - name: Test Windows adapters without display mutation
        run: dotnet test tests/MoniTopo.Windows.Tests/MoniTopo.Windows.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/windows
      - name: Test application without display mutation
        run: dotnet test tests/MoniTopo.App.Tests/MoniTopo.App.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/app
      - name: Publish smoke artifact
        run: dotnet publish src/MoniTopo.App/MoniTopo.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/publish
      - name: Validate Velopack packaging
        shell: pwsh
        run: ./eng/Pack-Release.ps1 -PackageVersion 2000.101.0 -PublishDirectory artifacts/publish -OutputDirectory artifacts/releases
      - uses: actions/upload-artifact@v7
        with:
          name: MoniTopo-win-x64-smoke
          path: |
            artifacts/publish
            artifacts/releases
            artifacts/coverage
